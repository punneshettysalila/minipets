<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Pets</title>
<style>
:root{--bg:#f6f3ee;--fg:#2a2622;--muted:#7a736b;--card:#fff;--line:#e2dcd2;--ink:#2a2622;--onink:#fff;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#f1ede6;--muted:#a39d93;--card:#262421;--line:#3a3733;--ink:#f1ede6;--onink:#1b1a18;--danger:#f2b8b5}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#f1ede6;--muted:#a39d93;--card:#262421;--line:#3a3733;--ink:#f1ede6;--onink:#1b1a18;--danger:#f2b8b5}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.72),transparent 48%),var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.desktop{background:transparent}
body.desktop #credit{display:none}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 105%,rgba(155,136,108,.12),transparent 55%)}
body.desktop #stage{background:transparent}
.pet{position:absolute;width:calc(var(--b)*var(--s));height:calc(var(--b)*var(--s));transform:translate(-50%,-50%);touch-action:none;cursor:grab}
.pet::after{content:"";position:absolute;left:19%;bottom:2%;width:62%;height:10%;border-radius:50%;background:rgba(38,31,24,.2);filter:blur(5px);transform:scaleY(.42);z-index:-1;pointer-events:none}
.pet.held{cursor:grabbing}
.pet.flight .rig{filter:drop-shadow(0 9px 5px rgba(47,37,27,.2))}
.pet.flight .tg{animation-duration:.18s}
.pet.typing .foot{animation:dangle .18s ease-in-out infinite alternate}
.pet-tools{position:absolute;left:50%;top:50%;display:flex;gap:5px;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:3}
.pet:hover .pet-tools,.pet.held .pet-tools{opacity:1;transform:translate(-50%,-115%) scale(1);pointer-events:auto}
.pet-tools button{width:27px;height:27px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);box-shadow:0 3px 10px rgba(47,37,27,.18);font-size:14px;line-height:1}
.rig{width:100%;height:100%;transform-origin:50% 92%;will-change:transform;filter:drop-shadow(0 5px 4px rgba(47,37,27,.16))}
.rig svg{width:100%;height:100%;overflow:visible;display:block}
.bub{position:absolute;left:50%;bottom:100%;transform:translate(-50%,4px);margin-bottom:2px;width:max-content;max-width:210px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.bub.show{opacity:1;transform:translate(-50%,0)}
.bub.below{bottom:auto;top:100%;margin:2px 0 0}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.tg{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.1s ease-in-out infinite}
.foot{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}50%{transform:scale(.97,1.04) skewX(2deg)}}
.held .tg{animation-duration:.3s}
.held .foot{animation:dangle .45s ease-in-out infinite alternate}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes dangle{from{transform:translateY(0)}to{transform:translateY(4px)}}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){.eye,.tg,.fl{animation:none}}
#fab{position:absolute;right:14px;bottom:14px;z-index:9999;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(47,37,27,.1)}
#credit{position:absolute;left:50%;bottom:18px;z-index:10;max-width:calc(100% - 150px);transform:translateX(-50%);color:var(--muted);font-size:11px;letter-spacing:.02em;text-align:center;pointer-events:none}
#sheet{position:absolute;right:10px;bottom:64px;z-index:9999;width:min(420px,calc(100% - 20px));max-height:72%;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-user-select:auto;user-select:auto}
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.hd b{font-weight:500;font-size:15px}.hd span{color:var(--muted);font-size:12px;flex:1}
#body{overflow-y:auto;padding:6px 14px 14px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--ink);color:var(--onink);border-color:var(--ink)}
button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.th{width:48px;height:48px;flex:none}.th svg{width:100%;height:100%}
.in{flex:1;min-width:0}.in b{font-weight:500}.in small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.sz{display:flex;align-items:center;gap:6px;margin-top:6px}.sz button{padding:2px 10px}.sz span{min-width:42px;text-align:center;font-size:12px;color:var(--muted)}
.ac{display:flex;flex-direction:column;gap:6px}.ac .x{font-size:12px;color:var(--danger)}
#newBtn{width:100%;margin-top:12px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],select{width:100%;box-sizing:border-box;padding:8px 10px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
#fphoto{width:100%;box-sizing:border-box;padding:7px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);font:inherit;color:var(--fg)}
#photoHint{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#prev{width:96px;height:96px;margin:6px auto 0}#prev svg{width:100%;height:100%}
#err{color:var(--danger);font-size:12px;min-height:16px;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:8px}.btns button{flex:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="credit">Application developed by Salila Punneshetty</div>
<button id="fab" aria-label="Open pet settings">Pets</button>
<div id="sheet" hidden>
  <div class="hd"><b>Your pets</b><span id="cap"></span><button id="done">Done</button></div>
  <div id="body">
    <div id="list"></div>
    <button id="newBtn">Create your own pet</button>
    <div id="form" hidden>
      <div id="prev"></div>
      <label for="fname">Name</label><input id="fname" type="text" maxlength="14" placeholder="Something that means something">
      <label for="fmean">What does the name mean? (optional)</label><input id="fmean" type="text" maxlength="70" placeholder="e.g. “Stardust” in Hindi">
      <label for="fphoto">Or make a mini doodle from a photo</label><input id="fphoto" type="file" accept="image/*"><small id="photoHint">The image stays on this device and is resized locally.</small>
      <label for="fsp">Species</label>
      <select id="fsp"><option value="robot">Robot</option><option value="droplet">Droplet</option><option value="leaf">Leaf</option><option value="owl">Owl</option><option value="eagle">Eagle</option><option value="flame">Flame</option></select>
      <label for="fcol">Color</label><input id="fcol" type="color" value="#9fb3c8">
      <div id="err"></div>
      <div class="btns"><button id="fcancel">Cancel</button><button id="fgo" class="pri">Create pet</button></div>
    </div>
  </div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const KEY='minipets.v1',MAX=2,MIN_S=.5,MAX_S=2.5,STEP=.15;
if(new URLSearchParams(location.search).has('desktop'))document.body.classList.add('desktop');
const PRESETS=[
{id:'axiom',name:'Axiom',species:'robot',color:'#9fb3c8',meaning:'A truth so clear it needs no proof. The first rule everything else builds on.'},
{id:'naia',name:'Naia',species:'droplet',color:'#4db3ff',meaning:'Greek for “flowing”, from the naiads, the nymphs of springs and rivers.'},
{id:'sylva',name:'Sylva',species:'leaf',color:'#6cc24a',meaning:'Latin for “forest”. Quiet, patient, and always growing.'},
{id:'noctua',name:'Noctua',species:'owl',color:'#a07850',meaning:'Latin for “night owl”, the bird that sat on Athena’s shoulder.'},
{id:'aquila',name:'Aquila',species:'eagle',color:'#7a5230',meaning:'Latin for “eagle”, and the constellation that carried Zeus’s thunderbolts.'},
{id:'agni',name:'Agni',species:'flame',color:'#ff8a3d',meaning:'Sanskrit for “fire”, the flame that carries offerings to the heavens.'}];

let mem;try{mem=JSON.parse(localStorage.getItem(KEY))||{}}catch{mem={}}
mem={firstRun:Date.now(),lastSeen:null,visits:0,active:['axiom','naia'],sizes:{},pos:{},custom:[],...mem};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch{}};
const all=()=>[...PRESETS,...mem.custom];
const def=id=>all().find(p=>p.id===id);
mem.active=mem.active.filter(def).slice(0,MAX);if(!mem.active.length)mem.active=['axiom','naia'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(a,b,f)=>a+(b-a)*f;

function shade(hex,a){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v+a)).toString(16).padStart(2,'0');return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(c).join('')}
const SPC={robot:'#9fb3c8',droplet:'#4db3ff',leaf:'#6cc24a',owl:'#a07850',eagle:'#7a5230',flame:'#ff8a3d'};
let GID=0;
function portraitSprite(data){
  const u='p'+(++GID);
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${u}c"><circle cx="60" cy="57" r="39"/></clipPath><filter id="${u}d"><feColorMatrix type="saturate" values=".72"/><feComponentTransfer><feFuncR type="linear" slope="1.08" intercept="-.04"/><feFuncG type="linear" slope="1.08" intercept="-.04"/><feFuncB type="linear" slope="1.08" intercept="-.04"/></feComponentTransfer></filter></defs><ellipse cx="60" cy="114" rx="30" ry="4.5" fill="#000" opacity=".14"/><path d="M31 107 Q38 91 60 91 Q82 91 89 107Z" fill="#6c83a0"/><image href="${data}" x="21" y="18" width="78" height="78" preserveAspectRatio="xMidYMid slice" clip-path="url(#${u}c)" filter="url(#${u}d)"/><circle cx="60" cy="57" r="40" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/><path d="M27 43 Q30 19 60 17 Q90 19 93 43" fill="none" stroke="#59483d" stroke-width="6" stroke-linecap="round" opacity=".75"/><circle class="eye" cx="46" cy="62" r="3.5" fill="#17202a"/><circle class="eye" cx="74" cy="62" r="3.5" fill="#17202a"/><path d="M52 75 Q60 81 68 75" stroke="#17202a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M43 103 Q60 95 77 103" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/></svg>`;
}
function sprite({species,color,portrait}){
  if(portrait)return portraitSprite(portrait);
  const u='g'+(++GID),c=color,d=shade(c,-45),dd=shade(c,-85),l=shade(c,55),ll=shade(c,100);
  const rg=(n,a,b)=>`<radialGradient id="${u}${n}" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
  const lg=(n,a,b)=>`<linearGradient id="${u}${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const f=n=>`url(#${u}${n})`;
  const S={
    robot:()=>({defs:lg('a',l,d)+lg('b',ll,c)+rg('c','#d8fbff','#27b5d6'),tail:'',
      body:`<rect x="28" y="72" width="9" height="24" rx="4.5" fill="${f('a')}"/><rect x="83" y="72" width="9" height="24" rx="4.5" fill="${f('a')}"/><rect x="36" y="66" width="48" height="40" rx="13" fill="${f('a')}"/><rect x="40" y="68" width="14" height="4" rx="2" fill="#fff" opacity=".35"/><rect x="46" y="76" width="28" height="16" rx="6" fill="${dd}" opacity=".85"/><circle cx="53" cy="84" r="3.5" fill="#ffb347"/><circle cx="62" cy="84" r="3.5" fill="#7ff0ff"/><circle cx="71" cy="84" r="3.5" fill="#8ff58f"/><rect class="foot" x="38" y="102" width="18" height="9" rx="4" fill="${dd}"/><rect class="foot" x="64" y="102" width="18" height="9" rx="4" fill="${dd}"/>`,
      head:`<line x1="60" y1="22" x2="60" y2="9" stroke="${dd}" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="8" r="4.5" fill="#ff6a4d"/><circle cx="58.6" cy="6.6" r="1.4" fill="#fff" opacity=".7"/><rect x="20" y="40" width="9" height="16" rx="4" fill="${f('a')}"/><rect x="91" y="40" width="9" height="16" rx="4" fill="${f('a')}"/><rect x="26" y="22" width="68" height="50" rx="18" fill="${f('b')}"/><rect x="32" y="24" width="30" height="4" rx="2" fill="#fff" opacity=".35"/><rect x="34" y="31" width="52" height="30" rx="12" fill="#18202b"/><path d="M36 40 Q60 33 84 40" stroke="#fff" stroke-opacity=".14" fill="none" stroke-width="3"/>`,
      eyes:`<circle class="eye" cx="48" cy="46" r="6" fill="${f('c')}"/><circle class="eye" cx="72" cy="46" r="6" fill="${f('c')}"/>`,
      face:`<rect x="52" y="64" width="16" height="3" rx="1.5" fill="${dd}" opacity=".6"/>`}),
    droplet:()=>{const P='M60 8 C60 8 22 54 22 78 C22 98 38 110 60 110 C82 110 98 98 98 78 C98 54 60 8 60 8Z';return{defs:lg('a',l,d),tail:'',
      body:`<ellipse cx="60" cy="111" rx="28" ry="4" fill="${c}" opacity=".35"/><ellipse class="foot" cx="46" cy="108" rx="8" ry="4.5" fill="${d}"/><ellipse class="foot" cx="74" cy="108" rx="8" ry="4.5" fill="${d}"/>`,
      head:`<path d="${P}" fill="${f('a')}"/><path d="${P}" fill="none" stroke="${d}" stroke-width="1.5" opacity=".6"/><ellipse cx="60" cy="100" rx="22" ry="6" fill="${ll}" opacity=".35"/><path d="M36 74 C34 62 42 50 52 38" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/><circle cx="42" cy="90" r="3" fill="#fff" opacity=".4"/><circle cx="82" cy="98" r="2.2" fill="#fff" opacity=".35"/>`,
      eyes:`<ellipse class="eye" cx="47" cy="76" rx="5" ry="6.5" fill="#12213a"/><ellipse class="eye" cx="73" cy="76" rx="5" ry="6.5" fill="#12213a"/><circle cx="48.8" cy="73.5" r="1.8" fill="#fff"/><circle cx="74.8" cy="73.5" r="1.8" fill="#fff"/>`,
      face:`<path d="M53 87 Q60 93 67 87" stroke="#12213a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="38" cy="86" r="4.5" fill="#ff9fb0" opacity=".4"/><circle cx="82" cy="86" r="4.5" fill="#ff9fb0" opacity=".4"/>`}},
    leaf:()=>{const P='M60 6 C94 22 102 58 86 82 C76 96 66 100 60 102 C54 100 44 96 34 82 C18 58 26 22 60 6Z';return{defs:lg('a',l,d),
      tail:`<path d="M74 100 C96 100 100 84 92 76" stroke="${d}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M92 76 C100 68 108 74 104 82 C98 84 94 82 92 76Z" fill="${c}"/>`,
      body:`<rect x="56" y="94" width="8" height="14" rx="3" fill="${d}"/><path d="M56 100 C44 94 38 100 40 105 C48 107 54 105 56 100Z" fill="${c}"/><ellipse class="foot" cx="48" cy="109" rx="9" ry="4.5" fill="${dd}"/><ellipse class="foot" cx="72" cy="109" rx="9" ry="4.5" fill="${dd}"/>`,
      head:`<path d="${P}" fill="${f('a')}"/><path d="${P}" fill="none" stroke="${d}" stroke-width="1.5" opacity=".6"/><path d="M60 14 L60 98" stroke="${d}" stroke-width="2.2" opacity=".35"/><g stroke="${d}" stroke-width="1.4" opacity=".28" fill="none" stroke-linecap="round"><path d="M60 34 L42 24"/><path d="M60 34 L78 24"/><path d="M60 48 L36 38"/><path d="M60 48 L84 38"/><path d="M60 88 L44 80"/><path d="M60 88 L76 80"/></g><path d="M40 40 C36 52 36 62 40 72" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".35"/>`,
      eyes:`<ellipse class="eye" cx="47" cy="64" rx="4.6" ry="6" fill="#16260f"/><ellipse class="eye" cx="73" cy="64" rx="4.6" ry="6" fill="#16260f"/><circle cx="48.6" cy="61.8" r="1.7" fill="#fff"/><circle cx="74.6" cy="61.8" r="1.7" fill="#fff"/>`,
      face:`<path d="M54 76 Q60 82 66 76" stroke="#16260f" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="38" cy="74" r="4.5" fill="#ff9fb0" opacity=".4"/><circle cx="82" cy="74" r="4.5" fill="#ff9fb0" opacity=".4"/>`}},
    owl:()=>({defs:rg('a',l,d)+rg('b',ll,l),tail:'',
      body:`<ellipse cx="60" cy="80" rx="34" ry="32" fill="${f('a')}"/><ellipse cx="60" cy="90" rx="22" ry="21" fill="${ll}" opacity=".85"/><g stroke="${d}" stroke-width="1.4" fill="none" opacity=".45" stroke-linecap="round"><path d="M50 80 q4 4 8 0"/><path d="M62 80 q4 4 8 0"/><path d="M44 90 q4 4 8 0"/><path d="M56 90 q4 4 8 0"/><path d="M68 90 q4 4 8 0"/><path d="M50 100 q4 4 8 0"/><path d="M62 100 q4 4 8 0"/></g><path d="M30 66 C16 76 18 100 34 106 C38 92 36 78 30 66Z" fill="${d}"/><path d="M90 66 C104 76 102 100 86 106 C82 92 84 78 90 66Z" fill="${d}"/><ellipse class="foot" cx="48" cy="110" rx="9" ry="4.5" fill="#e8a33d"/><ellipse class="foot" cx="72" cy="110" rx="9" ry="4.5" fill="#e8a33d"/>`,
      head:`<path d="M28 34 L36 12 L50 30Z" fill="${d}"/><path d="M92 34 L84 12 L70 30Z" fill="${d}"/><ellipse cx="60" cy="50" rx="35" ry="28" fill="${f('a')}"/><circle cx="45" cy="51" r="17" fill="${f('b')}"/><circle cx="75" cy="51" r="17" fill="${f('b')}"/><path d="M34 38 Q46 31 56 42" stroke="${dd}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M86 38 Q74 31 64 42" stroke="${dd}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
      eyes:`<circle class="eye" cx="45" cy="51" r="10" fill="#f6c342"/><circle class="eye" cx="75" cy="51" r="10" fill="#f6c342"/><circle cx="45" cy="51" r="5.5" fill="#111"/><circle cx="75" cy="51" r="5.5" fill="#111"/><circle cx="47.2" cy="48.6" r="2" fill="#fff"/><circle cx="77.2" cy="48.6" r="2" fill="#fff"/>`,
      face:`<path d="M55 57 L65 57 L60 70Z" fill="#f0a43a"/><path d="M60 57 L60 70" stroke="#c9822a" stroke-width="1"/>`}),
    eagle:()=>({defs:rg('a',l,d)+lg('b','#fbf8f1','#d8d1c2')+lg('c','#ffd75a','#d9961f'),
      tail:`<path d="M44 100 L38 118 L51 113 L60 119 L69 113 L82 118 L76 100Z" fill="${dd}"/>`,
      body:`<ellipse cx="60" cy="84" rx="30" ry="28" fill="${f('a')}"/><path d="M44 74 q4 6 8 0 M56 74 q4 6 8 0 M68 74 q4 6 8 0 M48 86 q4 6 8 0 M60 86 q4 6 8 0 M52 98 q4 6 8 0" stroke="${ll}" stroke-width="1.6" fill="none" opacity=".5" stroke-linecap="round"/><path d="M34 64 C14 74 14 102 30 112 C40 100 40 80 34 64Z" fill="${d}"/><path d="M86 64 C106 74 106 102 90 112 C80 100 80 80 86 64Z" fill="${d}"/><ellipse class="foot" cx="48" cy="111" rx="9" ry="4.5" fill="#f2c94c"/><ellipse class="foot" cx="72" cy="111" rx="9" ry="4.5" fill="#f2c94c"/>`,
      head:`<ellipse cx="60" cy="48" rx="28" ry="26" fill="${f('b')}"/><ellipse cx="60" cy="68" rx="22" ry="8" fill="#fbf8f1" opacity=".9"/><path d="M34 40 Q48 35 58 46 L56 50 Q46 44 36 46Z" fill="${dd}"/><path d="M86 40 Q72 35 62 46 L64 50 Q74 44 84 46Z" fill="${dd}"/>`,
      eyes:`<circle class="eye" cx="48" cy="49" r="5.5" fill="#f6c342"/><circle class="eye" cx="72" cy="49" r="5.5" fill="#f6c342"/><circle cx="48.6" cy="49.4" r="2.8" fill="#111"/><circle cx="72.6" cy="49.4" r="2.8" fill="#111"/><circle cx="49.6" cy="48" r="1" fill="#fff"/><circle cx="73.6" cy="48" r="1" fill="#fff"/>`,
      face:`<path d="M47 56 Q60 50 73 56 Q76 68 62 80 Q61 72 57 70 Q46 66 47 56Z" fill="${f('c')}"/><path d="M52 60 Q60 57 68 60" stroke="#b9791a" stroke-width="1.2" fill="none"/><circle cx="56" cy="62" r="1.3" fill="#8a5a12"/><circle cx="64" cy="62" r="1.3" fill="#8a5a12"/>`}),
    flame:()=>({defs:lg('a',l,d)+lg('b','#fff3b0','#ffc23d'),tail:'',
      body:`<ellipse class="foot" cx="47" cy="109" rx="8" ry="4.5" fill="${dd}"/><ellipse class="foot" cx="73" cy="109" rx="8" ry="4.5" fill="${dd}"/>`,
      head:`<path class="fl" d="M60 4 C64 24 94 40 94 74 C94 96 80 110 60 110 C40 110 26 96 26 74 C26 56 38 48 42 32 C48 40 52 44 55 44 C54 30 56 16 60 4Z" fill="${f('a')}"/><path class="fl" d="M60 40 C64 54 80 62 80 80 C80 96 72 104 60 104 C48 104 40 96 40 80 C40 66 54 58 60 40Z" fill="${f('b')}" opacity=".9"/><path d="M38 70 C36 60 42 52 48 48" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".35"/>`,
      eyes:`<ellipse class="eye" cx="49" cy="80" rx="4.2" ry="5.6" fill="#3a1608"/><ellipse class="eye" cx="71" cy="80" rx="4.2" ry="5.6" fill="#3a1608"/><circle cx="50.6" cy="77.8" r="1.6" fill="#fff"/><circle cx="72.6" cy="77.8" r="1.6" fill="#fff"/>`,
      face:`<path d="M54 90 Q60 96 66 90" stroke="#3a1608" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="41" cy="88" r="4.5" fill="#ff7a6b" opacity=".35"/><circle cx="79" cy="88" r="4.5" fill="#ff7a6b" opacity=".35"/>`}),
  };
  const s=(S[species]||S.robot)();
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs>${s.defs}</defs><ellipse cx="60" cy="114" rx="30" ry="4.5" fill="#000" opacity=".14"/><g class="tg">${s.tail}</g><g class="bd">${s.body}</g><g class="head">${s.head}<g class="eyes">${s.eyes}</g>${s.face||''}</g></svg>`;
}

/* greetings + memory */
function awayText(){
  if(!mem.lastSeen)return 'Nice to meet you!';
  const m=Math.round((Date.now()-mem.lastSeen)/60000);
  if(m<10)return 'Welcome back!';
  if(m<60)return `Back after ${m} min`;
  const h=Math.round(m/60);
  return h<48?`Back after ${h} hr`:`Back after ${Math.round(h/24)} days`;
}
let away=awayText();
function greetHTML(first){
  const d=new Date(),h=d.getHours();
  const part=h<5?'You’re up late!':h<12?'Good morning!':h<17?'Good afternoon!':h<21?'Good evening!':'Good night!';
  const day=d.toLocaleDateString(undefined,{weekday:'long'});
  const date=d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  const time=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return `<b>${part}</b><br>${day}, ${date} · ${time}${first?`<br>${away}`:''}`;
}

/* stage + pets */
const stage=$('#stage');let SW=0,SH=0,OX=0,OY=0,Z=1;
const pets=new Map(),ptr={x:0,y:0};let lastMove=0,lastRand=0;
function measure(){const r=stage.getBoundingClientRect();SW=r.width;SH=r.height;OX=r.left;OY=r.top;stage.style.setProperty('--b',Math.min(150,Math.max(90,Math.min(SW,SH)*.28))+'px')}
const px=p=>parseFloat(stage.style.getPropertyValue('--b'))*(mem.sizes[p.id]||1);
function clampPos(p){const s=px(p),hx=Math.min(s/2,SW/2),hy=Math.min(s/2,SH/2);p.x=Math.max(hx,Math.min(SW-hx,p.x));p.y=Math.max(hy,Math.min(SH-hy,p.y))}
function applyPos(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.fx=p.x/SW;p.fy=p.y/SH}

function say(p,html){
  p.bub.innerHTML=html;p.bub.classList.toggle('below',p.y-px(p)/2<90);p.bub.classList.add('show');
  clearTimeout(p.bt);p.bt=setTimeout(()=>p.bub.classList.remove('show'),4500);
}
function spawn(id){
  const d=def(id);if(!d)return;
  const el=document.createElement('div');el.className='pet';el.style.setProperty('--s',mem.sizes[id]||1);el.style.zIndex=++Z;
  el.innerHTML=`<div class="bub"></div><div class="pet-tools"><button data-tool="settings" aria-label="Open pet settings" title="Available pets and create a new pet">⚙</button><button data-tool="remove" aria-label="Remove this pet" title="Remove this pet">×</button></div><div class="rig">${sprite(d)}</div>`;
  const q=mem.pos[id],o=[...pets.values()][0];
  const p={id,d,el,rig:el.querySelector('.rig'),bub:el.querySelector('.bub'),head:el.querySelector('.head'),eyes:el.querySelector('.eyes'),
    x:q?q[0]*SW:SW*(o&&o.x<SW/2?.68:.32),y:q?q[1]*SH:SH*.58,ex:0,ey:0,hx:0,hy:0,hr:0,tilt:0,tv:0,vx:0,hop:0,hv:0,perk:0,held:false,taps:0,moved:0,bt:0,action:'sitting',actionAt:performance.now()+5000};
  clampPos(p);applyPos(p);
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.pet-tools'))return;
    if(e.button>0)return;e.preventDefault();
    p.held=true;p.moved=0;p.action='flying';p.dx=e.clientX-OX-p.x;p.dy=e.clientY-OY-p.y;p.lx=e.clientX;p.ly=e.clientY;
    el.setPointerCapture(e.pointerId);el.classList.add('held');el.style.zIndex=++Z;
    el.classList.add('flight');
  });
  el.addEventListener('pointermove',e=>{
    if(!p.held)return;
    p.moved+=Math.hypot(e.clientX-p.lx,e.clientY-p.ly);p.vx=e.clientX-p.lx;p.lx=e.clientX;p.ly=e.clientY;
    p.x=e.clientX-OX-p.dx;p.y=e.clientY-OY-p.dy;clampPos(p);applyPos(p);
  });
  const up=()=>{
    if(!p.held)return;p.held=false;el.classList.remove('held');
    el.classList.remove('flight');p.action='sitting';p.actionAt=performance.now()+4500;
    if(p.moved<6){p.hv=6;p.taps++;say(p,p.taps%2?greetHTML(false):`<b>${esc(p.d.name)}</b><br>${esc(p.d.meaning)}`)}
    else{mem.pos[id]=[p.fx,p.fy];save()}
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('dblclick',e=>{if(!e.target.closest('.pet-tools'))say(p,`<b>${esc(p.d.name)}</b><br>${esc(p.d.meaning)}`)});
  el.querySelector('[data-tool="settings"]').onclick=e=>{e.stopPropagation();sheet.hidden=false;form.hidden=true;$('#newBtn').hidden=false;renderList()};
  el.querySelector('[data-tool="remove"]').onclick=e=>{
    e.stopPropagation();
    mem.active=mem.active.filter(activeId=>activeId!==id);
    if(!mem.active.length)mem.active=['axiom'];
    delete mem.pos[id];save();syncPets();renderList();
  };
  el.addEventListener('wheel',e=>{e.preventDefault();resize(id,e.deltaY<0?STEP:-STEP)},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
  stage.append(el);pets.set(id,p);return p;
}
function syncPets(){
  for(const [id,p] of pets)if(!mem.active.includes(id)){p.el.remove();pets.delete(id)}
  mem.active.forEach(id=>{if(!pets.has(id))spawn(id)});
}
function resize(id,delta){
  const s=Math.max(MIN_S,Math.min(MAX_S,(mem.sizes[id]||1)+delta));mem.sizes[id]=Math.round(s*100)/100;
  const p=pets.get(id);if(p){p.el.style.setProperty('--s',mem.sizes[id]);clampPos(p);applyPos(p);mem.pos[id]=[p.fx,p.fy]}
  save();renderList();
}

/* pointer tracking (eyes + head follow) */
addEventListener('pointermove',e=>{ptr.x=e.clientX-OX;ptr.y=e.clientY-OY;lastMove=Date.now()});
addEventListener('pointerdown',e=>{ptr.x=e.clientX-OX;ptr.y=e.clientY-OY;lastMove=Date.now()});

function frame(t){
  const idle=Date.now()-lastMove>6000;
  if(idle&&t-lastRand>2600){ptr.x=Math.random()*SW;ptr.y=Math.random()*SH;lastRand=t}
  pets.forEach(p=>{
    if(!p.held&&t>p.actionAt){p.action=p.action==='sitting'?'typing':p.action==='typing'?'jumping':'sitting';p.actionAt=t+(p.action==='jumping'?2200:6500)}
    const dx=ptr.x-p.x,dy=ptr.y-p.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/240),nx=dx/d*k,ny=dy/d*k;
    p.ex=L(p.ex,nx*3.4,.18);p.ey=L(p.ey,ny*2.8,.18);
    p.hx=L(p.hx,nx*4,.12);p.hy=L(p.hy,ny*3,.12);p.hr=L(p.hr,nx*7,.12);
    p.perk=L(p.perk,(!p.held&&!idle&&d<px(p)*1.4)?1:0,.1);
    p.tv+=((p.held?Math.max(-30,Math.min(30,p.vx*1.6)):0)-p.tilt)*.14;p.tv*=.82;p.tilt+=p.tv;p.vx*=.85;
    if(p.hop>0||p.hv>0){p.hv-=.8;p.hop+=p.hv;if(p.hop<=0){p.hop=0;p.hv=0}}
    if(p.action==='jumping'&&!p.held&&p.hop===0)p.hv=5;
    p.el.classList.toggle('typing',p.action==='typing'&&!p.held);
    const br=Math.sin(t/650+p.x)*.02,up=p.perk*.05+(p.held?.08:0);
    p.rig.style.transform=`translateY(${-p.hop*px(p)/120-(p.held?6:0)}px) rotate(${p.tilt+Math.sin(t/1400+p.y)*1.2}deg) scale(${1+br+up},${1-br+up})`;
    p.head.setAttribute('transform',`translate(${p.hx.toFixed(2)} ${(p.hy-p.perk*2).toFixed(2)}) rotate(${p.hr.toFixed(2)} 60 88)`);
    p.eyes.setAttribute('transform',`translate(${p.ex.toFixed(2)} ${p.ey.toFixed(2)})`);
  });
  requestAnimationFrame(frame);
}

/* panel */
const sheet=$('#sheet'),list=$('#list'),form=$('#form');
function renderList(){
  list.innerHTML=all().map(d=>{
    const on=mem.active.includes(d.id),s=Math.round((mem.sizes[d.id]||1)*100);
    return `<div class="row"><div class="th">${sprite(d)}</div><div class="in"><b>${esc(d.name)}</b><small>${esc(d.meaning)}</small>${on?`<div class="sz"><button data-a="dn" data-id="${d.id}" aria-label="Smaller">−</button><span>${s}%</span><button data-a="up" data-id="${d.id}" aria-label="Bigger">+</button></div>`:''}</div><div class="ac"><button class="${on?'on':''}" data-a="tg" data-id="${d.id}">${on?'On screen':'Show'}</button>${d.custom?`<button class="x" data-a="del" data-id="${d.id}">Delete</button>`:''}</div></div>`;
  }).join('');
  $('#cap').textContent=`${mem.active.length} of ${MAX} on screen`;
}
function show(id){
  if(mem.active.includes(id)){if(mem.active.length>1)mem.active=mem.active.filter(i=>i!==id)}
  else{mem.active.push(id);if(mem.active.length>MAX)mem.active.shift()}
  save();syncPets();renderList();
}
list.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==='tg')show(id);
  else if(a==='up')resize(id,STEP);
  else if(a==='dn')resize(id,-STEP);
  else if(a==='del'){
    mem.custom=mem.custom.filter(c=>c.id!==id);mem.active=mem.active.filter(i=>i!==id);
    if(!mem.active.length)mem.active=['axiom'];
    delete mem.sizes[id];delete mem.pos[id];save();syncPets();renderList();
  }
});
$('#fab').onclick=()=>{sheet.hidden=!sheet.hidden;if(!sheet.hidden)renderList()};
$('#done').onclick=()=>{sheet.hidden=true;form.hidden=true;$('#newBtn').hidden=false};
stage.addEventListener('pointerdown',e=>{if(e.target===stage)sheet.hidden=true});

let portraitData='';
const prev=()=>{$('#prev').innerHTML=sprite(portraitData?{portrait:portraitData}:{species:$('#fsp').value,color:$('#fcol').value})};
$('#newBtn').onclick=()=>{form.hidden=false;$('#newBtn').hidden=true;$('#err').textContent='';prev();$('#fname').focus()};
$('#fsp').oninput=()=>{$('#fcol').value=SPC[$('#fsp').value];prev()};$('#fcol').oninput=prev;
$('#fphoto').onchange=()=>{
  const file=$('#fphoto').files[0];if(!file)return;
  if(!file.type.startsWith('image/')){$('#err').textContent='Choose an image file.';return}
  const reader=new FileReader();
  reader.onload=()=>{
    const image=new Image();
    image.onload=()=>{
      const side=96,canvas=document.createElement('canvas');canvas.width=side;canvas.height=side;
      const ctx=canvas.getContext('2d'),scale=Math.max(side/image.width,side/image.height),w=image.width*scale,h=image.height*scale;
      ctx.fillStyle='#efe7dc';ctx.fillRect(0,0,side,side);ctx.filter='saturate(.72) contrast(1.08)';
      ctx.drawImage(image,(side-w)/2,(side-h)/2,w,h);portraitData=canvas.toDataURL('image/jpeg',.72);
      $('#photoHint').textContent='Photo ready: your mini doodle will be made locally.';$('#err').textContent='';prev();
    };
    image.onerror=()=>{$('#err').textContent='That image could not be read.'};image.src=reader.result;
  };
  reader.onerror=()=>{$('#err').textContent='Could not read that image.'};reader.readAsDataURL(file);
};
$('#fcancel').onclick=()=>{form.hidden=true;$('#newBtn').hidden=false;portraitData='';$('#fphoto').value=''};
$('#fgo').onclick=async()=>{
  const name=$('#fname').value.trim();
  if(!name){$('#err').textContent='Give your pet a name.';return}
  if(all().some(p=>p.name.toLowerCase()===name.toLowerCase())){$('#err').textContent='That name already belongs to a pet. Make it yours.';return}
  const pet={id:'c'+Date.now(),name,species:portraitData?'portrait':$('#fsp').value,color:$('#fcol').value,portrait:portraitData||null,custom:true,meaning:$('#fmean').value.trim()||'A one-of-a-kind friend, named by you.'};
  mem.custom.push(pet);form.hidden=true;$('#newBtn').hidden=false;$('#fname').value='';$('#fmean').value='';
  $('#fphoto').value='';portraitData='';
  show(pet.id);
};

/* lifecycle */
function stamp(){mem.lastSeen=Date.now();save()}
function init(){
  measure();ptr.x=SW/2;ptr.y=SH/2;
  mem.visits++;syncPets();
  let i=0;pets.forEach(p=>say(p,greetHTML(i++===0)));
  stamp();requestAnimationFrame(frame);
  setInterval(()=>{if(!document.hidden)stamp()},30000);
  addEventListener('pagehide',stamp);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return stamp();
    if((Date.now()-mem.lastSeen)/60000>=10){away=awayText();let k=0;pets.forEach(p=>say(p,greetHTML(k++===0)))}
    stamp();
  });
  new ResizeObserver(()=>{measure();pets.forEach(p=>{p.x=p.fx*SW;p.y=p.fy*SH;clampPos(p);applyPos(p)})}).observe(stage);
}
init();
})();
</script>
</body>
</html>
